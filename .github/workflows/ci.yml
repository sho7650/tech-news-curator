name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-test:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Lint
        working-directory: api
        run: npx biome check src/

      - name: Type check
        working-directory: api
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: api
        run: npm test

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [api-test]

    services:
      postgres:
        image: postgres:16.11
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: news_curator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      # Run the same SQL migrations production applies (not drizzle-kit push)
      # so the checked-in migration files are exercised on every CI run.
      - name: Run DB migrations
        working-directory: api
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://news:testpassword@localhost:5432/news_curator
          DATABASE_ADMIN_URL: postgresql://news:testpassword@localhost:5432/news_curator

      - name: Verify migrated schema
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U news -d news_curator -c "\dt" | grep -q articles \
            || { echo "::error::Table 'articles' not found — migrations did not apply"; exit 1; }
          psql -h localhost -U news -d news_curator -tAc \
            "SELECT 1 FROM pg_indexes WHERE indexname = 'ix_articles_published_at_desc'" | grep -qx 1 \
            || { echo "::error::Index 'ix_articles_published_at_desc' not found — migration 0001 did not apply"; exit 1; }

      - name: Start API server
        working-directory: api
        run: node --import tsx src/index.ts &
        env:
          DATABASE_URL: postgresql://news:testpassword@localhost:5432/news_curator
          ENVIRONMENT: development
          API_KEYS: test-key-for-testing

      - name: Wait for API server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/health && break
            sleep 1
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          API_URL: http://localhost:8100
          TEST_API_KEY: test-key-for-testing

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
