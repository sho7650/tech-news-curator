name: Security & Quality

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: cd api && npm ci
      # The API faces network input, so moderate advisories (ReDoS, parser DoS) matter.
      - run: cd api && npm audit --omit=dev --audit-level=moderate

  frontend-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build api/ -t news-api-test
      - run: docker build frontend/ -t news-frontend-test
